name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No secrets in the repository history (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --redact --verbose --no-banner
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
      - run: pip install -r requirements.txt
      - name: Every Python file compiles
        run: python -m compileall -q -x "/\.git/" .
      - name: Scorer and review tests on fixture data
        run: python -m unittest discover -s tests -v
      - name: Published numbers match the results files
        run: python scripts/check_results.py
      - name: Published results contain no email addresses
        run: bench check-anon
      - name: The Harbor grader scores an empty output 0
        # The real accounts file is private, and without one the grader stops at data_missing. A placeholder makes it grade.
        # No API key and no claude CLI on the runner, so the review is skipped and nothing is sent anywhere.
        run: |
          task=$(mktemp -d)
          cp -R harbor/write-precall-briefs/tests "$task/tests"
          mkdir "$task/empty" "$task/logs"
          echo "domain,bullet_1,bullet_2,bullet_3,first_line" > "$task/empty/output.csv"
          { echo "domain,account_name,contact_name,contact_title"
            for i in $(seq 1 50); do echo "example-$i.com,Account $i,Contact $i,VP Sales"; done; } > "$task/tests/t6-accounts.csv"
          (cd "$task/tests" && ANTHROPIC_API_KEY= HARBOR_LOGS="$task/logs" python3 grade.py "$task/empty")
          python3 -c "import json,sys; r=json.load(open(sys.argv[1])); sys.exit(0 if r.get('reward') == 0 and r.get('rows_filled') == 0 and 'data_missing' not in r else 1)" "$task/logs/reward.json"
      - name: Only the summary, the results table, the audit agreement and the manifest subset are published
        run: |
          extra=$(ls results | grep -vE '^(summary\.csv|t6-results\.csv|audit-agreement\.csv|manifest-t6\.json)$' || true)
          test -z "$extra" || { echo "unexpected files in results/: $extra"; exit 1; }
      - name: No private data committed
        run: test ! -e private
